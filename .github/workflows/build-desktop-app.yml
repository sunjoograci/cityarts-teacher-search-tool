name: Build desktop app

# Manual + tag-triggered only — NOT on every push to main. This build takes
# several minutes per OS and produces multi-hundred-MB artifacts; nothing
# about it should run on every commit. Push a tag like "desktop-v1" to cut
# a release build, or run it by hand from the Actions tab for a test build.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Two macOS entries, not one: PyInstaller builds natively for
        # whatever chip it runs on, and an arm64-only build cannot run at
        # all on an Intel Mac (no Rosetta translation in that direction —
        # confirmed the hard way: "not supported on this Mac" on a real
        # Intel office machine). macos-15-intel is GitHub's current Intel
        # label (macos-13 was retired Dec 2025); it's supported through
        # roughly Fall 2027, after which Intel Mac support on GitHub-hosted
        # runners goes away entirely and this will need revisiting.
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Write build-time config (server URL + shared secret)
        shell: python
        env:
          REMOTE_INGEST_URL: ${{ secrets.DESKTOP_REMOTE_INGEST_URL }}
          REMOTE_INGEST_SECRET: ${{ secrets.DESKTOP_REMOTE_INGEST_SECRET }}
        run: |
          import os
          import sys

          url = os.environ.get("REMOTE_INGEST_URL", "")
          secret = os.environ.get("REMOTE_INGEST_SECRET", "")
          if not url or not secret:
              print(
                  "::error::Repo secrets DESKTOP_REMOTE_INGEST_URL and "
                  "DESKTOP_REMOTE_INGEST_SECRET must both be set "
                  "(Settings -> Secrets and variables -> Actions) before "
                  "building. See the security note in src/remote_ingest.py "
                  "/ app.py's /api/ingest/school docstring."
              )
              sys.exit(1)

          with open("desktop_config.py", "w") as f:
              f.write(f"REMOTE_INGEST_URL = {url!r}\n")
              f.write(f"REMOTE_INGEST_SECRET = {secret!r}\n")

      - name: Build with PyInstaller
        run: pyinstaller desktop_app.spec --noconfirm
        env:
          # actions/setup-python's macOS Python is a universal2 (fat)
          # binary, and PyInstaller's auto-detected target_arch from that
          # has been unreliable (see desktop_app.spec) — pin it explicitly
          # per matrix leg instead of trusting auto-detection.
          PYINSTALLER_TARGET_ARCH: ${{ runner.os == 'macOS' && (runner.arch == 'ARM64' && 'arm64' || 'x86_64') || '' }}

      - name: Verify macOS binary architecture
        if: runner.os == 'macOS'
        run: |
          expected=$([ "${{ runner.arch }}" = "ARM64" ] && echo arm64 || echo x86_64)
          actual=$(lipo -archs "dist/CityArtsTeacherFinder.app/Contents/MacOS/CityArtsTeacherFinder")
          echo "Runner arch: ${{ runner.arch }} -> expected slice: $expected; built slice(s): $actual"
          if ! echo "$actual" | tr ' ' '\n' | grep -qx "$expected"; then
            echo "::error::Built .app is '$actual' but this runner (${{ runner.arch }}) needs '$expected'. This is exactly the 'not supported on this Mac' bug — failing instead of shipping a broken artifact."
            exit 1
          fi

      - name: Zip macOS .app
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent CityArtsTeacherFinder.app "CityArtsTeacherFinder-mac-${{ runner.arch }}.zip"

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CityArtsTeacherFinder-windows
          path: dist/CityArtsTeacherFinder.exe
          retention-days: 90

      # Two separate macOS artifacts (ARM64 = Apple Silicon, X64 = Intel) —
      # not one universal2 binary. A merged universal2 build needs every
      # dependency with a C extension (aiohttp, Brotli, Pillow, playwright's
      # driver, etc.) available as a universal2/dual-arch wheel, which
      # isn't guaranteed; two native single-arch builds are slower to
      # distribute (two files) but can't be broken by a missing wheel for
      # one arch silently poisoning the other.
      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: CityArtsTeacherFinder-mac-${{ runner.arch }}
          path: dist/CityArtsTeacherFinder-mac-${{ runner.arch }}.zip
          retention-days: 90
