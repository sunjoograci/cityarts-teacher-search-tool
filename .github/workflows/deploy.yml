name: Deploy to Oracle

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SCRAPE_SHARED_SECRET: ${{ secrets.SCRAPE_SHARED_SECRET }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: DEPLOY_TOKEN,SCRAPE_SHARED_SECRET
          command_timeout: 30m
          script: |
            set -e
            cd /opt/cityarts
            sudo git fetch https://x-access-token:$DEPLOY_TOKEN@github.com/sunjoograci/cityarts-teacher-search-tool.git main
            sudo git reset --hard FETCH_HEAD
            sudo docker build -t cityarts .
            sudo docker stop cityarts 2>/dev/null || true
            sudo docker rm cityarts 2>/dev/null || true
            # This host is an Always Free micro instance (1/8 OCPU, 1GB RAM
            # total) — --shm-size=1gb would reserve the box's *entire* RAM
            # as shared memory alone, so it's kept modest instead. Chromium
            # concurrency is pinned to 1: even two concurrent headless
            # Chromium instances contend badly for both the fractional CPU
            # and the 1GB ceiling (Render's SCRAPE_CONCURRENCY=4 assumes far
            # more headroom than this box has).
            #
            # SCRAPE_SHARED_SECRET authenticates /api/ingest/school (remote
            # scrapers, e.g. the packaged desktop app) and /api/scrape/*
            # (see app.py's _check_ingest_secret). Required — without it,
            # anyone who can reach this box's port 8080 can write into the
            # shared teacher database.
            sudo docker run -d \
              --name cityarts \
              --restart always \
              --shm-size=256m \
              -v /data:/data \
              -e DB_PATH=/data/schools.db \
              -e SCRAPE_CONCURRENCY=1 \
              -e SCRAPE_SHARED_SECRET="$SCRAPE_SHARED_SECRET" \
              -p 8080:8080 \
              -e PORT=8080 \
              cityarts
